name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshot baselines
    uses: ./.github/workflows/goldens.yml

  checks:
    name: Analyze and test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [nsw, all-regions]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Run project CI checks
        env:
          CI_MODE: ${{ matrix.mode }}
        run: ./scripts/ci.sh "$CI_MODE"

      - name: Upload deterministic test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-test-coverage-${{ matrix.mode }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Build split debug APKs
        run: |
          cp .env.template .env
          flutter pub get
          flutter build apk --debug --split-per-abi

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  android-e2e:
    name: Android saved-trip E2E
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Run saved-trip flow on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            cp .env.template .env
            flutter pub get
            flutter test integration_test/saved_trip_journey_test.dart -d emulator-5554
