name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows:
      - Test Suite
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > .env
          echo "Created .env file with API key"

      - name: Build Flutter web
        run: |
          flutter build web --release
          echo "Flutter web build completed"

      - name: Prepare web artifacts
        run: |
          ls -la build/web/

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: always()
        run: |
          echo "Deployment status: ${{ steps.deployment.outcome }}"
          if [ "${{ steps.deployment.outcome }}" == "success" ]; then
            echo "Web app deployed successfully to GitHub Pages!"
            echo "URL: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "Deployment encountered an issue. Check the logs above."
          fi
