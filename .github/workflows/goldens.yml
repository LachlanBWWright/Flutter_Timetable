name: Screenshot goldens

on:
  workflow_call:

permissions:
  contents: read

jobs:
  screenshots:
    name: Compare screenshot baselines
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compare committed screenshot baselines
        run: ./scripts/check_goldens.sh
