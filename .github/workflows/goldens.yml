name: Screenshot goldens

on:
  workflow_call:

permissions:
  contents: read

jobs:
  screenshots:
    name: Compare screenshot baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compare committed screenshot baselines
        run: ./scripts/check_goldens.sh

      - name: Upload screenshot failure comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-failures
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 7
