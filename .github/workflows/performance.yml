name: Performance profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Run profile scenarios
        run: xvfb-run -a ./scripts/profile.sh linux
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-performance-${{ github.sha }}
          path: build/performance/
          if-no-files-found: warn
          retention-days: 30
