name: Release Android APKs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
      tag:
        description: New GitHub Release tag, for example v1.0.0
        required: true
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          for value in "$BUILD_REF" "$RELEASE_TAG"; do
            if [[ -z "$value" || "$value" == -* ]]; then
              echo "Build ref and release tag must be nonempty and cannot start with '-'." >&2
              exit 1
            fi
          done
          git check-ref-format --allow-onelevel "$BUILD_REF"
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Capture built commit and verify existing tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          built_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'commit=%s\n' "$built_commit" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$tag_commit" != "$built_commit" ]]; then
              echo "Release tag already points to a different commit; refusing to publish." >&2
              exit 1
            fi
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Validate release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Configure public deployment credentials
        env:
          BUNDLE_PUBLIC_TFNSW_KEY: ${{ vars.BUNDLE_PUBLIC_TFNSW_KEY }}
          PUBLIC_TFNSW_API_KEY: ${{ secrets.PUBLIC_TFNSW_API_KEY }}
        run: bash scripts/create_deployment_env.sh

      - name: Build split release APKs
        run: |
          set -Eeuo pipefail
          flutter pub get
          flutter analyze
          flutter test --exclude-tags=integration,golden --concurrency=1 --reporter compact
          flutter build apk --release --split-per-abi --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK signatures
        run: |
          set -Eeuo pipefail
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$build_tools/apksigner" verify --verbose "$apk"
          done
          (cd build/app/outputs/flutter-apk && sha256sum *-release.apk > SHA256SUMS.txt)

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          CREATE_DRAFT: ${{ inputs.draft }}
          CREATE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -Eeuo pipefail
          # Check the remote again in case the tag changed during the build.
          tag_ref="refs/tags/$RELEASE_TAG"
          if remote_tags="$(git ls-remote --exit-code --tags origin "$tag_ref" "$tag_ref^{}")"; then
            tag_commit="$(awk '$2 !~ /\^\{\}$/ { direct=$1 } $2 ~ /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' <<< "$remote_tags")"
            if [[ "$tag_commit" != "$BUILT_COMMIT" ]]; then
              echo "Release tag points to a different commit; refusing to publish." >&2
              exit 1
            fi
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            # An ordinary push atomically fails if another job creates this tag.
            # Never force, overwrite, or move an existing release tag.
            git push origin "$BUILT_COMMIT:$tag_ref"
          fi
          args=("$RELEASE_TAG" build/app/outputs/flutter-apk/*-release.apk build/app/outputs/flutter-apk/SHA256SUMS.txt --title "$RELEASE_TAG" --generate-notes --target "$BUILT_COMMIT" --verify-tag)
          if [[ "$CREATE_DRAFT" == "true" ]]; then args+=(--draft); fi
          if [[ "$CREATE_PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
