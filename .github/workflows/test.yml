name: Test Suite

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      PTV_DEV_ID: ${{ secrets.PTV_DEV_ID }}
      PTV_API_KEY: ${{ secrets.PTV_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          printf 'API_KEY=%s\n' "$API_KEY" > .env
          printf 'PTV_DEV_ID=%s\n' "$PTV_DEV_ID" >> .env
          printf 'PTV_API_KEY=%s\n' "$PTV_API_KEY" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run deterministic tests
        run: flutter test --exclude-tags integration

      - name: Run integration smoke tests
        if: ${{ env.API_KEY != '' && env.PTV_DEV_ID != '' && env.PTV_API_KEY != '' }}
        run: flutter test --tags integration
