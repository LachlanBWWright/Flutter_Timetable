name: Transit cache backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'lib/transit/cache/provider_sources.dart'
      - '.github/workflows/transit-cache.yml'
  push:
    branches: [main, master, dev]
    paths:
      - 'backend/**'
      - 'lib/transit/cache/provider_sources.dart'
      - '.github/workflows/transit-cache.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
